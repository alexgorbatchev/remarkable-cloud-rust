[package]
name = "remarkable-cloud"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Async reMarkable Cloud Sync v3 client with snapshot-checked writes"

[dependencies]
base64 = "0.22"
crc32c = "0.6"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
httpdate = "1"
hyper = "1"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["follow-redirect"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tiny_http = "0.12"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
